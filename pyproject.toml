[project]
name = "dataops-copilot"
version = "0.1.0"
description = "Pipeline-run monitoring, anomaly detection and AI incident copilot (Quantic MSSE Capstone)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pgvector>=0.2",
  "pandas>=2.2",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "httpx>=0.27",
  "anthropic>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
  "bandit>=1.7",
  "playwright>=1.44",
  "pytest-playwright>=0.5",
  "locust>=2.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs Postgres (DATABASE_URL)",
  "e2e: needs a running app (BASE_URL)",
]
addopts = "-q -m 'not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
source = ["app"]
omit = ["app/simulator/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
